name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 11, not 17: this project uses Android Gradle Plugin 7.0.2,
      # which does not get along with newer JDKs.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Flutter 3.13.9 ships Dart 3.1.5, which is what pubspec.yaml asks for.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dakhir-apk
          path: build/app/outputs/flutter-apk/*.apk
